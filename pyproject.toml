[project]
name = "pyform"
version = "0.1.0.dev0"
description = "ModernGL and GLFW graphics exploration engine and procedural forms runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gabriel Frigo", email = "gabriel.frigo4@gmail.com" }]
keywords = ["opengl", "moderngl", "glfw", "graphics", "procedural", "gamedev", "shaders"]
dependencies = [
    "glfw>=2.7.0",
    "miniaudio>=1.71",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
    "pillow>=12.3.0",
    "pyglm>=2.8.3",
]

[project.scripts]
pyform = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["game", "main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]