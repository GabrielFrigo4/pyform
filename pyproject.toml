[project]
name = "pyform"
version = "0.1.0"
description = "ModernGL and GLFW graphics exploration engine and procedural forms runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gabriel Frigo", email = "gabriel.frigo@outlook.com" }]
keywords = ["opengl", "moderngl", "glfw", "graphics", "procedural", "gamedev", "shaders"]
dependencies = [
    "glfw>=2.7.0",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
]

[project.scripts]
pyform = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
